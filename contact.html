<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <!-- PASTE THE EXACT SAME <head> SECTION FROM INDEX.HTML HERE -->
</head>
<body class="bg-brand-black text-white font-sans antialiased overflow-x-hidden">

    <!-- PASTE THE EXACT SAME <nav> SECTION FROM INDEX.HTML HERE -->
    <!-- PASTE THE EXACT SAME <div id="mobile-menu"> SECTION FROM INDEX.HTML HERE -->

    <!-- CONTACT SECTION -->
    <section class="pt-40 pb-24 px-[5%] bg-white text-brand-black min-h-screen">
        <div class="max-w-2xl mx-auto text-center">
            <h2 class="text-4xl font-bold mb-4">Let's discuss your requirements.</h2>
            <p class="text-gray-600 mb-10 text-lg">Submit an enquiry and a member of our team will be in touch.</p>
            
            <!-- FORMSPREE FORM -->
            <form action="https://formspree.io/f/mnpdworp" method="POST" class="text-left space-y-6">
                <div>
                    <label for="name" class="block font-semibold mb-2 text-sm">Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-brand-purple focus:ring-1 focus:ring-brand-purple transition-all">
                </div>
                <div>
                    <label for="email" class="block font-semibold mb-2 text-sm">Email</label>
                    <input type="email" id="email" name="_replyto" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-brand-purple focus:ring-1 focus:ring-brand-purple transition-all">
                </div>
                <div>
                    <label for="message" class="block font-semibold mb-2 text-sm">Message</label>
                    <textarea id="message" name="message" rows="5" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-brand-purple focus:ring-1 focus:ring-brand-purple transition-all"></textarea>
                </div>
                <button type="submit" class="w-full bg-brand-purple hover:bg-brand-purplehover text-white font-bold py-4 rounded-full transition-all duration-300 transform hover:-translate-y-1 shadow-lg shadow-brand-purple/30">Submit Enquiry</button>
            </form>
        </div>
    </section>
