<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | MountainView Group</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { bg: '#050505', muted: '#888888', border: '#222222' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg text-white font-sans antialiased min-h-screen relative">
    
    <div class="bg-grid"></div>
    <div class="ambient-light light-white" style="bottom: 0; right: 0; width: 400px; height: 400px; opacity: 0.05;"></div>

    <header class="bg-[#0a0a0a]/90 backdrop-blur-sm border-b border-brand-border px-8 py-5 flex justify-between items-center relative z-10">
        <div class="flex items-center gap-3">
            <img src="logo.jpg" alt="MountainView Group Logo" class="h-8 w-auto object-contain">
            <span class="font-bold text-lg tracking-widest uppercase text-white" style="font-family: 'Outfit', sans-serif;">Client Portal</span>
        </div>
        <div class="flex items-center gap-6">
            <a href="index.html" class="text-sm text-brand-muted hover:text-white transition-colors">Logout</a>
        </div>
    </header>
    
    <main class="p-8 max-w-6xl mx-auto relative z-10">
        <h1 class="text-3xl font-bold mb-8 text-white">Welcome, Client Name</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-[#0a0a0a]/80 backdrop-blur-sm p-6 rounded-xl border border-brand-border hover:border-white/30 transition-colors">
                <h3 class="text-brand-muted text-sm font-semibold mb-2 uppercase tracking-wider font-mono">Latest Financials</h3>
                <p class="text-2xl font-bold text-white">View Report</p>
            </div>
            <div class="bg-[#0a0a0a]/80 backdrop-blur-sm p-6 rounded-xl border border-brand-border hover:border-white/30 transition-colors">
                <h3 class="text-brand-muted text-sm font-semibold mb-2 uppercase tracking-wider font-mono">Tax Deadlines</h3>
                <p class="text-2xl font-bold text-white">No upcoming</p>
            </div>
            <div class="bg-[#0a0a0a]/80 backdrop-blur-sm p-6 rounded-xl border border-brand-border hover:border-white/30 transition-colors">
                <h3 class="text-brand-muted text-sm font-semibold mb-2 uppercase tracking-wider font-mono">Support</h3>
                <p class="text-2xl font-bold text-white">Open Ticket</p>
            </div>
        </div>
    </main>
</body>
</html>
