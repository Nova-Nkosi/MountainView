<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | MountainView</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;background:#f4f4f4;margin:0} header{background:#0B1D33;color:#fff;padding:20px;display:flex;justify-content:space-between} .wrap{padding:20px;max-width:800px;margin:auto} .card{background:#fff;padding:20px;border-radius:14px;margin-bottom:20px} input,select,textarea{width:100%;padding:11px;margin:8px 0;border:1px solid #ddd;border-radius:10px} button{padding:11px 18px;background:#C9A227;border:none;border-radius:10px;font-weight:bold;cursor:pointer} .doc{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between}</style>
</head><body><header><b>MountainView Portal</b><button onclick="logout()">Logout</button></header>
<div class="wrap">
<div class="card"><h3>Welcome, <span id="name">Client</span></h3><p id="email"></p></div>
<div class="card"><h3>Upload Document</h3><input type="file" id="file"><button onclick="upload()">Upload</button><p id="upmsg"></p></div>
<div class="card"><h3>My Documents</h3><div id="docs">Loading...</div></div>
<div class="card"><h3>New Request</h3><select id="service"><option>Tax Return</option><option>Bookkeeping</option><option>Payroll</option><option>CIPC / Company</option><option>Other</option></select><textarea id="message" placeholder="Tell us what you need..."></textarea><button onclick="sendRequest()">Send Request</button></div>
<div class="card"><h3>My Requests</h3><div id="reqs">Loading...</div></div>
</div><script>
const supabase = window.supabase.createClient("https://nfnoeenrevzcqoteicvt.supabase.co","sb_publishable_wTaTJgD4Cw3FaSTaeXiDjQ_Ua9Iyil8");
let user=null;
async function init(){
  const {data}=await supabase.auth.getUser();
  if(!data.user){window.location.href='portal.html';return}
  user=data.user;
  document.getElementById('email').innerText=user.email;
  const {data:prof}=await supabase.from('profiles').select('*').eq('id',user.id).single();
  if(prof) document.getElementById('name').innerText=prof.full_name||user.email;
  loadDocs(); loadReqs();
}
async function upload(){
  const f=document.getElementById('file').files[0]; if(!f) return alert('Choose a file');
  const path=user.id+'/'+Date.now()+'-'+f.name;
  const {error}=await supabase.storage.from('client-files').upload(path,f);
  if(error) return alert(error.message);
  await supabase.from('documents').insert({client_id:user.id,file_name:f.name,file_url:path,uploaded_by:'client'});
  document.getElementById('upmsg').innerText='Uploaded!';
  loadDocs();
}
async function loadDocs(){
  const {data}=await supabase.from('documents').select('*').eq('client_id',user.id).order('created_at',{ascending:false});
  document.getElementById('docs').innerHTML=data.map(d=>`<div class="doc"><span>${d.file_name} - ${d.uploaded_by}</span><button onclick="download('${d.file_url}','${d.file_name}')">Download</button></div>`).join('')||'No documents yet';
}
async function download(path,name){
  const {data}=await supabase.storage.from('client-files').createSignedUrl(path,60);
  if(data) window.open(data.signedUrl);
}
async function sendRequest(){
  const service=document.getElementById('service').value; const message=document.getElementById('message').value;
  const {error}=await supabase.from('requests').insert({client_id:user.id,service,message});
  if(error) alert(error.message); else {alert('Request sent'); loadReqs();}
}
async function loadReqs(){
  const {data}=await supabase.from('requests').select('*').eq('client_id',user.id).order('created_at',{ascending:false});
  document.getElementById('reqs').innerHTML=data.map(r=>`<p><b>${r.service}</b> - ${r.status}<br>${r.message}</p>`).join('')||'No requests yet';
}
async function logout(){await supabase.auth.signOut(); window.location.href='portal.html'}
init();
</script></body></html>
