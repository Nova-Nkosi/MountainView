<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal Login | MountainView</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;background:#0B1D33;color:#fff;display:flex;justify-content:center;padding:40px 15px} .box{background:#fff;color:#111;padding:30px;border-radius:16px;width:100%;max-width:400px} input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px} button{width:100%;padding:13px;background:#C9A227;border:none;border-radius:10px;font-weight:bold;cursor:pointer} a{color:#0B1D33}</style>
</head><body><div class="box">
<h2>MountainView Client Portal</h2><p>Login with the details we sent you.</p>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg"></p><p><a href="index.html">← Back to website</a></p>
</div><script>
const supabase = window.supabase.createClient("https://nfnoeenrevzcqoteicvt.supabase.co","sb_publishable_wTaTJgD4Cw3FaSTaeXiDjQ_Ua9Iyil8");
async function login(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  const {error}=await supabase.auth.signInWithPassword({email,password});
  if(error){document.getElementById('msg').innerText=error.message}else{window.location.href='dashboard.html'}
}
</script></body></html>
