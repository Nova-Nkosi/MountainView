<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal Login | MountainView Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { black: '#121212', offblack: '#1a1a1a', purple: '#4C1D95', purplehover: '#6D28D9', gray: '#a3a3a3' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-brand-black text-white font-sans antialiased flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 bg-brand-offblack rounded-2xl border border-white/10 shadow-2xl">
        <div class="text-center mb-10">
            <a href="index.html" class="inline-flex items-center gap-3 mb-6">
                <img src="logo.jpg" alt="MountainView Group" class="h-10 w-auto">
                <span class="font-bold text-xl tracking-wide">MOUNTAINVIEW<span class="text-brand-purple">GROUP</span></span>
            </a>
            <h2 class="text-2xl font-bold">Client Portal</h2>
            <p class="text-brand-gray text-sm mt-2">Secure access for MountainView clients.</p>
        </div>
        <form class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-semibold mb-2">Email Address</label>
                <input type="email" id="email" class="w-full px-4 py-3 bg-brand-black border border-white/10 rounded-lg focus:outline-none focus:border-brand-purple text-white">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold mb-2">Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 bg-brand-black border border-white/10 rounded-lg focus:outline-none focus:border-brand-purple text-white">
            </div>
            <button type="button" class="w-full bg-brand-purple hover:bg-brand-purplehover text-white font-bold py-3 rounded-lg transition-all duration-300">Sign In</button>
        </form>
        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-brand-gray hover:text-white transition-colors">&larr; Return to main site</a>
        </div>
    </div>
</body>
</html>
